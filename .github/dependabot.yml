# Dependabot keeps dependencies up to date by opening PRs automatically.
# cooldown: only pick up new versions after a few days. Hijacked, malicious
# releases are usually detected and yanked within hours.
# Security updates still arrive immediately.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
