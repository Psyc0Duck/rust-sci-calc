name: Build

# Builds the calculator for Windows, Linux and macOS.
# For a tag like "v0.1.0" the files are published as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Link the C runtime statically so the exe runs without extra packages.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked
      - name: Build installer with NSIS
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          command -v makensis || choco install nsis -y --no-progress
          MAKENSIS=$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")
          mkdir -p dist
          cp target/release/taschenrechner.exe dist/taschenrechner.exe
          # NSIS on Windows needs Windows-style paths.
          "$MAKENSIS" -DVERSION="$VERSION" \
            -DEXE="$(cygpath -w "$PWD/target/release/taschenrechner.exe")" \
            -DOUTFILE="$(cygpath -w "$PWD/dist/Taschenrechner-Setup.exe")" \
            "$(cygpath -w "$PWD/installer/windows.nsi")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          tar -czf dist/taschenrechner-linux-x86_64.tar.gz -C target/release taschenrechner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal binary (Apple Silicon and Intel)
        run: |
          mkdir -p dist
          lipo -create -output taschenrechner \
            target/aarch64-apple-darwin/release/taschenrechner \
            target/x86_64-apple-darwin/release/taschenrechner
          zip dist/taschenrechner-macos.zip taschenrechner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the release was already created on github.com, only attach the files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
