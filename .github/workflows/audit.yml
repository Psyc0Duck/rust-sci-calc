name: Security audit

# Prüft alle Abhängigkeiten mit cargo-deny (Regeln in deny.toml):
# bekannte Sicherheitslücken (RustSec-Datenbank), erlaubte Lizenzen und Herkunft (nur crates.io).
# Läuft bei Änderungen an den Abhängigkeiten und zusätzlich jeden Montag.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
