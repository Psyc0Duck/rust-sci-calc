# Rules for cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Checks dependencies for known vulnerabilities, allowed licenses and that
# code only comes from crates.io.

[graph]
all-features = true

[advisories]
# Warnings (e.g. unmaintained crates, yanked versions) fail the check too.
unmaintained = "all"
yanked = "deny"
# zvariant, zvariant_derive and zbus_names were merged into zbus 6 and are no
# longer maintained on their own. They are pulled in by eframe's screen-reader
# support (accesskit_unix on Linux) and contain no known vulnerability. Remove
# these entries once eframe depends on zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained only, waiting for eframe to move to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained only, waiting for eframe to move to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained only, waiting for eframe to move to zbus 6" },
]

[licenses]
# Licenses compatible with Apache-2.0 that allow redistributing the binaries.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# crates.io only, no dependencies pulled directly from git repositories.
unknown-registry = "deny"
unknown-git = "deny"
