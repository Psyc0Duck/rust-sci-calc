# Regeln für cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Prüft Abhängigkeiten auf bekannte Sicherheitslücken, erlaubte Lizenzen
# und darauf, dass Code nur von crates.io kommt.

[graph]
all-features = true

[advisories]
# Auch Warnungen (z. B. "nicht mehr gepflegt", zurückgezogene Versionen) lassen den Check fehlschlagen.
unmaintained = "all"
yanked = "deny"

[licenses]
# Lizenzen, die mit Apache-2.0 vereinbar sind und die Weitergabe der Programme erlauben.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Nur crates.io, keine Abhängigkeiten direkt aus fremden Git-Repos.
unknown-registry = "deny"
unknown-git = "deny"
