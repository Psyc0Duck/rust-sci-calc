# Rules for cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Checks dependencies for known vulnerabilities, allowed licenses and that
# code only comes from crates.io.

[graph]
all-features = true

[advisories]
# Warnings (e.g. unmaintained crates, yanked versions) fail the check too.
unmaintained = "all"
yanked = "deny"

[licenses]
# Licenses compatible with Apache-2.0 that allow redistributing the binaries.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# crates.io only, no dependencies pulled directly from git repositories.
unknown-registry = "deny"
unknown-git = "deny"
